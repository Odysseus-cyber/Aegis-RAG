[project]
name = "aegis-rag"
version = "0.1.0"
description = "Self-hosted multi-turn RAG for compliance document Q&A"
requires-python = ">=3.11,<3.12"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".runtime", "volumes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:.*swigvarlink.*"
]
